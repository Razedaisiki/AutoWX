[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autowx"
version = "0.1.0"
description = "WeChat group bot with web search (wx4py + MiMo router + Tavily)"
requires-python = ">=3.12"

[project.optional-dependencies]
runtime = [
    "wx4py==0.2.1",
    "pywin32",
    "tavily-python",
]

[tool.setuptools.packages.find]
where = ["src"]
