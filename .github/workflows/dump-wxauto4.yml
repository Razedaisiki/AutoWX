name: Dump wxauto4 Source

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: windows-2022

    steps:
      - name: Install wxauto4
        shell: powershell
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install wxauto4

          Write-Host "=== installed package ==="
          python -m pip show wxauto4

      - name: Dump actual wxauto4 files
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import wxauto4
          import wxauto4.ui.main
          import wxauto4.wx

          print("=" * 80)
          print("wxauto4 package location")
          print("=" * 80)
          print(wxauto4.__file__)

          def dump(path, start, end):
              path = Path(path)

              print()
              print("=" * 80)
              print("FILE:", path)
              print(f"LINES {start}-{end}")
              print("=" * 80)

              print("Exists:", path.exists())

              if not path.exists():
                  return

              data = path.read_bytes()

              print("File size:", len(data))
              print("First 32 bytes:", data[:32])

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  text = data.decode("utf-8", errors="replace")

              lines = text.splitlines()

              print("Total lines:", len(lines))

              for n in range(start, min(end, len(lines)) + 1):
                  print(f"{n:4}: {lines[n-1]}")

          dump(wxauto4.ui.main.__file__, 140, 220)
          dump(wxauto4.wx.__file__, 220, 280)
          '@ | Set-Content "$env:GITHUB_WORKSPACE\dump_files.py" -Encoding UTF8

          python "$env:GITHUB_WORKSPACE\dump_files.py"

      - name: Inspect wxauto4 package files
        shell: powershell
        run: |
          Write-Host "=== pip show -f ==="
          python -m pip show -f wxauto4

          Write-Host ""
          Write-Host "=== Actual package tree ==="

          $pkg = (python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          $wxdir = Join-Path $pkg "wxauto4"

          Write-Host "Package dir: $wxdir"

          if (Test-Path $wxdir) {
            Get-ChildItem `
              -Path $wxdir `
              -Recurse `
              -File |
              Select-Object FullName, Length
          } else {
            Write-Host "wxauto4 package directory not found at expected path."
          }

      - name: Inspect wxauto4 module loader
        shell: powershell
        run: |
          @'
          import wxauto4
          import wxauto4.ui.main as main
          import wxauto4.wx as wx

          modules = [
              ("wxauto4", wxauto4),
              ("wxauto4.ui.main", main),
              ("wxauto4.wx", wx),
          ]

          for name, mod in modules:
              print("=" * 70)
              print(name)
              print("=" * 70)

              print("__file__:")
              print(getattr(mod, "__file__", None))

              print("__spec__.origin:")
              spec = getattr(mod, "__spec__", None)
              print(getattr(spec, "origin", None))

              print("loader:")
              print(type(getattr(spec, "loader", None)))

              print("loader repr:")
              print(repr(getattr(spec, "loader", None)))

              print()
          '@ | Set-Content inspect_loader.py -Encoding UTF8

          python inspect_loader.py

      - name: Runtime introspection of wxauto4 classes
        shell: powershell
        run: |
          @'
          from wxauto4 import WeChat
          from wxauto4.ui.main import WeChatMainWnd

          print("=== dir(WeChatMainWnd) ===")
          print([n for n in dir(WeChatMainWnd) if not n.startswith("__")])

          print()
          print("=== WeChatMainWnd.__dict__ keys ===")
          print(list(WeChatMainWnd.__dict__.keys()))

          print()
          print("=== WeChatMainWnd class attrs ===")
          for k, v in WeChatMainWnd.__dict__.items():
              if not k.startswith("__"):
                  print(f"{k} = {v!r}")

          print()
          print("=== dir(WeChat) ===")
          print([n for n in dir(WeChat) if not n.startswith("__")])
          '@ | Set-Content introspect.py -Encoding UTF8

          python introspect.py
