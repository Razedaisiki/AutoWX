name: WeChat GUI Test

on:
  workflow_dispatch:

jobs:
  wechat-test:
    runs-on: windows-2022

    steps:
      - name: Show system info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser

          Write-Host "=== WINGET ==="
          winget --version

      - name: Install WeChat
        shell: powershell
        run: |
          winget install `
            --id Tencent.WeChat.Universal `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

      - name: Find WeChat executable
        shell: powershell
        run: |
          Write-Host "Searching for WeChat.exe..."

          $wechat = Get-ChildItem `
            "C:\Program Files",
            "C:\Program Files (x86)",
            "$env:LOCALAPPDATA" `
            -Filter WeChat.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $wechat) {
            Write-Host "WeChat.exe not found"
            exit 1
          }

          Write-Host "Found:"
          Write-Host $wechat.FullName

          "WECHAT_EXE=$($wechat.FullName)" >> $env:GITHUB_ENV

      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching:"
          Write-Host $env:WECHAT_EXE

          Start-Process $env:WECHAT_EXE

          Write-Host "Waiting for WeChat UI..."
          Start-Sleep -Seconds 20

          Write-Host "=== WeChat processes ==="
          Get-Process |
            Where-Object {
              $_.ProcessName -match "WeChat|Weixin"
            } |
            Select-Object ProcessName, Id, SessionId, MainWindowTitle

      - name: Take desktop screenshot
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          Write-Host "Screen:"
          Write-Host "$($bounds.Width)x$($bounds.Height)"

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-desktop.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Saved screenshot:"
          Write-Host $path

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-desktop
          path: wechat-desktop.png
