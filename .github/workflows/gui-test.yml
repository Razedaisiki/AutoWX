name: WeChat 3.9.11.16 Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wechat-old-test:
    runs-on: windows-2022

    steps:
      - name: Show session info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser

          Write-Host "=== OS ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      # ---------------------------------------------------------
      # 1. 通过 Cloudflare v4 代理下载固定版本
      # ---------------------------------------------------------
      - name: Download WeChat 3.9.11.16 via Cloudflare v4
        shell: powershell
        run: |
          $url = "https://v4.gh-proxy.org/https://github.com/tom-snow/wechat-windows-versions-x86/releases/download/v3.9.11.16/WeChatSetupX86-3.9.11.16.exe"

          $installer = "$env:TEMP\WeChatSetupX86-3.9.11.16.exe"

          Write-Host "Downloading WeChat 3.9.11.16..."
          Write-Host $url

          $start = Get-Date

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --progress-bar `
            -o $installer `
            $url

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed."
          }

          $seconds = ((Get-Date) - $start).TotalSeconds
          $sizeMB = (Get-Item $installer).Length / 1MB

          Write-Host ""
          Write-Host "Download completed."
          Write-Host ("Size:  {0:N2} MB" -f $sizeMB)
          Write-Host ("Time:  {0:N2} seconds" -f $seconds)
          Write-Host ("Speed: {0:N2} MB/s" -f ($sizeMB / $seconds))

          "WECHAT_INSTALLER=$installer" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 2. 验证 SHA256
      # ---------------------------------------------------------
      - name: Verify SHA256
        shell: powershell
        run: |
          $expected = "e649b4a616a1e45094858d111cb1306c08cb73b7743718050c93b2b92575ce84"

          $actual = (
            Get-FileHash `
              $env:WECHAT_INSTALLER `
              -Algorithm SHA256
          ).Hash.ToLower()

          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"

          if ($actual -ne $expected) {
            Remove-Item $env:WECHAT_INSTALLER -Force
            throw "SHA256 mismatch!"
          }

          Write-Host "SHA256 verification passed."

      # ---------------------------------------------------------
      # 3. 静默安装
      # ---------------------------------------------------------
      - name: Install old WeChat
        shell: powershell
        run: |
          Write-Host "Installing WeChat 3.9.11.16 x86..."

          Start-Process `
            -FilePath $env:WECHAT_INSTALLER `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Installer exited."

          Start-Sleep -Seconds 5

      # ---------------------------------------------------------
      # 4. 搜索老版本 WeChat.exe
      # ---------------------------------------------------------
      - name: Find WeChat executable
        shell: powershell
        run: |
          $roots = @(
            "${env:ProgramFiles(x86)}",
            "$env:ProgramFiles",
            "$env:LOCALAPPDATA"
          )

          Write-Host "Searching for old WeChat.exe..."

          $wechat = Get-ChildItem `
            -Path $roots `
            -Filter "WeChat.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "Tencent|WeChat"
            } |
            Select-Object -First 1

          if (-not $wechat) {
            Write-Host "WeChat.exe not found."

            Write-Host ""
            Write-Host "Possible Tencent/WeChat directories:"

            Get-ChildItem `
              -Path $roots `
              -Directory `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "Tencent|WeChat"
              } |
              Select-Object -First 100 FullName

            exit 1
          }

          Write-Host "Found:"
          Write-Host $wechat.FullName

          Write-Host ""
          Write-Host "File version:"
          Write-Host $wechat.VersionInfo.FileVersion

          "WECHAT_EXE=$($wechat.FullName)" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 5. 启动微信
      # ---------------------------------------------------------
      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching:"
          Write-Host $env:WECHAT_EXE

          Start-Process $env:WECHAT_EXE

          Write-Host "Waiting for UI..."
          Start-Sleep -Seconds 20

          Write-Host ""
          Write-Host "=== WeChat processes ==="

          Get-Process |
            Where-Object {
              $_.ProcessName -match "WeChat"
            } |
            Select-Object `
              ProcessName,
              Id,
              SessionId,
              MainWindowTitle,
              Path

      # ---------------------------------------------------------
      # 6. 截图
      # ---------------------------------------------------------
      - name: Take screenshot
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          Write-Host "Screen:"
          Write-Host "$($bounds.Width)x$($bounds.Height)"

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-3.9.11.16.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Screenshot saved:"
          Write-Host $path

      # ---------------------------------------------------------
      # 7. 上传截图
      # ---------------------------------------------------------
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-3.9.11.16-screenshot
          path: wechat-3.9.11.16.png
