name: VXBot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vxbot
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUNBUFFERED: "1"

  WECHAT_REPO: "cscnk52/wechat-windows-versions"
  WECHAT_VERSION: "4.1.8"
  GH_PROXY: "https://v4.gh-proxy.org/"

  MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
  MODEL_API_BASE: ${{ vars.MODEL_API_BASE }}
  MODEL_NAME: ${{ vars.MODEL_NAME }}
  VX_GROUPS_JSON: ${{ vars.VX_GROUPS_JSON }}

  BOT_CONTEXT_SIZE: "8"

jobs:
  wechat-test:
    runs-on: windows-2022

    steps:
      # =========================================================
      # 1. 检查 Windows GUI Session
      # =========================================================
      - name: Show session info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser

      # =========================================================
      # 2. 自动寻找最新的 4.1.8.x Release
      # =========================================================
      - name: Resolve latest WeChat 4.1.8 release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = $env:WECHAT_REPO

          $headers = @{
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent"    = "AutoWX"
          }

          $all = @()

          for ($page = 1; $page -le 5; $page++) {
            $api = "https://api.github.com/repos/$repo/releases?per_page=100&page=$page"

            $batch = Invoke-RestMethod `
              -Uri $api `
              -Headers $headers

            if (-not $batch -or $batch.Count -eq 0) {
              break
            }

            $all += $batch
          }

          $release = $all |
            Where-Object {
              $_.tag_name -match '^v4\.1\.8\.'
            } |
            Sort-Object {
              [version]($_.tag_name.TrimStart('v'))
            } -Descending |
            Select-Object -First 1

          if (-not $release) {
            throw "No WeChat 4.1.8.x release found."
          }

          Write-Host "Selected:"
          Write-Host $release.tag_name
          Write-Host $release.name

          $asset = $release.assets |
            Where-Object {
              $_.name -match '\.exe$'
            } |
            Sort-Object size -Descending |
            Select-Object -First 1

          if (-not $asset) {
            throw "No EXE asset found."
          }

          $original = $asset.browser_download_url
          $proxy = "$env:GH_PROXY$original"

          Write-Host ""
          Write-Host "Asset:"
          Write-Host $asset.name

          Write-Host ""
          Write-Host "Proxy URL:"
          Write-Host $proxy

          "WECHAT_TAG=$($release.tag_name)" >> $env:GITHUB_ENV
          "WECHAT_FILENAME=$($asset.name)" >> $env:GITHUB_ENV
          "WECHAT_PROXY_URL=$proxy" >> $env:GITHUB_ENV

          if ($asset.digest) {
            Write-Host ""
            Write-Host "GitHub asset digest:"
            Write-Host $asset.digest
            "WECHAT_DIGEST=$($asset.digest)" >> $env:GITHUB_ENV
          }

      # =========================================================
      # 3. 通过 Cloudflare v4 下载
      # =========================================================
      - name: Download WeChat via Cloudflare v4
        shell: powershell
        run: |
          $installer = "$env:TEMP\$env:WECHAT_FILENAME"

          Write-Host "Downloading:"
          Write-Host $env:WECHAT_PROXY_URL

          $start = Get-Date

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 2 `
            --connect-timeout 30 `
            --progress-bar `
            -o $installer `
            $env:WECHAT_PROXY_URL

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed."
          }

          $seconds = ((Get-Date) - $start).TotalSeconds
          $sizeMB = (Get-Item $installer).Length / 1MB

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Download completed"
          Write-Host ("Size:  {0:N2} MB" -f $sizeMB)
          Write-Host ("Time:  {0:N2} seconds" -f $seconds)
          Write-Host ("Speed: {0:N2} MB/s" -f ($sizeMB / $seconds))
          Write-Host "======================================"

          "WECHAT_INSTALLER=$installer" >> $env:GITHUB_ENV

      # =========================================================
      # 4. SHA256 校验（有 digest 则校验，否则仅打印）
      # =========================================================
      - name: Verify SHA256
        shell: powershell
        run: |
          $actual = (
            Get-FileHash `
              $env:WECHAT_INSTALLER `
              -Algorithm SHA256
          ).Hash.ToLower()

          Write-Host "Actual SHA256:"
          Write-Host $actual

          if ($env:WECHAT_DIGEST) {
            $expected = $env:WECHAT_DIGEST `
              -replace "^sha256:", ""

            $expected = $expected.ToLower()

            Write-Host ""
            Write-Host "Expected (from GitHub digest):"
            Write-Host $expected

            if ($actual -ne $expected) {
              Remove-Item $env:WECHAT_INSTALLER -Force
              throw "SHA256 mismatch! Installation aborted."
            }

            Write-Host ""
            Write-Host "SHA256 verification passed."
          } else {
            Write-Host ""
            Write-Host "No digest available from release asset."
            Write-Host "Record the SHA256 above to pin it later."
          }

      # =========================================================
      # 5. 安装微信
      # =========================================================
      - name: Install WeChat
        shell: powershell
        run: |
          Write-Host "Installing WeChat..."

          Start-Process `
            -FilePath $env:WECHAT_INSTALLER `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Installation completed."

      # =========================================================
      # 6. 找微信路径
      # =========================================================
      - name: Locate WeChat
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\Tencent\Weixin\Weixin.exe",
            "C:\Program Files (x86)\Tencent\Weixin\Weixin.exe",
            "C:\Program Files\Tencent\WeChat\WeChat.exe",
            "C:\Program Files (x86)\Tencent\WeChat\WeChat.exe"
          )

          $wechat = $candidates |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (-not $wechat) {
            throw "WeChat executable not found."
          }

          Write-Host "Found:"
          Write-Host $wechat

          Write-Host ""
          Write-Host "File version:"
          Write-Host (Get-Item $wechat).VersionInfo.FileVersion

          "WECHAT_EXE=$wechat" >> $env:GITHUB_ENV

      # =========================================================
      # 7. 启动微信并动态等待窗口
      # =========================================================
      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching:"
          Write-Host $env:WECHAT_EXE

          Start-Process $env:WECHAT_EXE

          $found = $false

          for ($i = 0; $i -lt 30; $i++) {
            $process = Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              } |
              Where-Object {
                $_.MainWindowHandle -ne 0
              } |
              Select-Object -First 1

            if ($process) {
              Write-Host "WeChat window detected after $i seconds."
              Write-Host "PID: $($process.Id)"
              Write-Host "Title: $($process.MainWindowTitle)"

              $found = $true
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $found) {
            throw "WeChat GUI was not detected."
          }

          Start-Sleep -Seconds 2

      # =========================================================
      # 8. 截二维码
      # =========================================================
      - name: Capture login QR
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-login.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Login screenshot saved."

      # =========================================================
      # 9. 上传二维码
      # =========================================================
      - name: Upload login QR
        id: upload-qr
        uses: actions/upload-artifact@v4
        with:
          name: wechat-login
          path: wechat-login.png
          retention-days: 1

      # =========================================================
      # 10. 输出二维码 Artifact 地址
      # =========================================================
      - name: Print QR URL
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "DOWNLOAD QR AND SCAN NOW:"
          Write-Host "${{ steps.upload-qr.outputs.artifact-url }}"
          Write-Host "======================================"
          Write-Host ""

      # =========================================================
      # 11. 等待登录（最多 2 分钟）
      # =========================================================
      - name: Wait for WeChat login
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(
                  IntPtr hWnd,
                  out RECT lpRect
              );

              public struct RECT {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }
          }
          "@

          Write-Host "Waiting for login..."
          Write-Host "Maximum: 2 minutes."

          $deadline = (Get-Date).AddMinutes(2)
          $loggedIn = $false

          while ((Get-Date) -lt $deadline) {
            $processes = Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              }

            foreach ($p in $processes) {
              $p.Refresh()

              if ($p.MainWindowHandle -eq 0) {
                continue
              }

              $rect = New-Object Win32+RECT

              if ([Win32]::GetWindowRect($p.MainWindowHandle, [ref]$rect)) {
                $width = $rect.Right - $rect.Left
                $height = $rect.Bottom - $rect.Top

                Write-Host (
                  "[{0}] PID={1} Process={2} Size={3}x{4}" -f `
                  (Get-Date -Format "HH:mm:ss"),
                  $p.Id,
                  $p.ProcessName,
                  $width,
                  $height
                )

                if ($width -ge 500 -and $height -ge 400) {
                  Write-Host ""
                  Write-Host "======================================"
                  Write-Host "LOGIN SUCCESS DETECTED"
                  Write-Host "======================================"

                  $loggedIn = $true
                  break
                }
              }
            }

            if ($loggedIn) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $loggedIn) {
            throw "Login timeout."
          }

          Start-Sleep -Seconds 3

      # =========================================================
      # 12. 关闭可能的弹窗
      # =========================================================
      - name: Normalize WeChat window
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@

          $p = Get-Process |
            Where-Object {
              $_.ProcessName -match "Weixin|WeChat" -and
              $_.MainWindowHandle -ne 0
            } |
            Select-Object -First 1

          if ($p) {
            [Win32]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
            Start-Sleep -Seconds 2
          }

      # =========================================================
      # 13. 登录成功后截图
      # =========================================================
      - name: Capture logged-in screen
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-logged-in.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

      - name: Upload logged-in screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-logged-in
          path: wechat-logged-in.png
          retention-days: 1

      # =========================================================
      # 14. 设置 Python 3.12
      # =========================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 15. 配置 UTF-8 控制台
      # =========================================================
      - name: Configure UTF-8 console
        shell: powershell
        run: |
          chcp 65001

          [Console]::InputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          [Console]::OutputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          $OutputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          Write-Host "=== Encoding ==="

          python -X utf8 -c `
            "import sys; print(sys.stdout.encoding); print('中文日志测试成功')"

      # =========================================================
      # 16. 安装 wx4py（固定已验证版本）
      # =========================================================
      - name: Install wx4py
        shell: powershell
        run: |
          chcp 65001 > $null

          python -X utf8 -m pip install `
            --upgrade pip

          python -X utf8 -m pip install `
            "wx4py==0.2.1"

          python -X utf8 -m pip install pywin32

          python -X utf8 -c `
            "import importlib.metadata as m; print('wx4py version:', m.version('wx4py'))"

      # =========================================================
      # 17. 启动 VXBot
      # =========================================================
      - name: Start VXBot
        shell: powershell
        run: |
          chcp 65001 > $null

          [Console]::InputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          [Console]::OutputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          $OutputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          Write-Host "======================================"
          Write-Host "Starting VXBot"
          Write-Host "======================================"

          python -X utf8 `
            "$env:GITHUB_WORKSPACE\vxbot.py"
