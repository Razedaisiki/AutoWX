name: WeChat 4.1 Login Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WECHAT_REPO: "cscnk52/wechat-windows-versions"
  WECHAT_TAG: "v4.1.11.55"
  GH_PROXY: "https://v4.gh-proxy.org/"

jobs:
  wechat-test:
    runs-on: windows-2022

    steps:
      # =========================================================
      # 1. 检查 Windows GUI Session
      # =========================================================
      - name: Show session info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser


      # =========================================================
      # 2. 从 cscnk52 GitHub Release 获取真正的安装包 URL
      # =========================================================
      - name: Resolve WeChat Release Asset
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $api = "https://api.github.com/repos/$env:WECHAT_REPO/releases/tags/$env:WECHAT_TAG"

          $headers = @{
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent"    = "AutoWX"
          }

          Write-Host "Fetching release:"
          Write-Host $api

          $release = Invoke-RestMethod `
            -Uri $api `
            -Headers $headers

          Write-Host ""
          Write-Host "Release:"
          Write-Host "Tag:  $($release.tag_name)"
          Write-Host "Name: $($release.name)"

          Write-Host ""
          Write-Host "=== Assets ==="

          foreach ($asset in $release.assets) {
            Write-Host "--------------------------------"
            Write-Host "Name: $($asset.name)"
            Write-Host "Size: $($asset.size)"
            Write-Host "URL:  $($asset.browser_download_url)"
          }

          # 找 exe，优先最大的 exe 安装包
          $asset = $release.assets |
            Where-Object {
              $_.name -match "\.exe$"
            } |
            Sort-Object size -Descending |
            Select-Object -First 1

          if (-not $asset) {
            throw "No EXE asset found in release $env:WECHAT_TAG"
          }

          $originalUrl = $asset.browser_download_url
          $proxyUrl = "$env:GH_PROXY$originalUrl"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Selected asset:"
          Write-Host $asset.name
          Write-Host ""
          Write-Host "Original:"
          Write-Host $originalUrl
          Write-Host ""
          Write-Host "Cloudflare v4:"
          Write-Host $proxyUrl
          Write-Host "======================================"

          "WECHAT_FILENAME=$($asset.name)" >> $env:GITHUB_ENV
          "WECHAT_PROXY_URL=$proxyUrl" >> $env:GITHUB_ENV


      # =========================================================
      # 3. 通过 Cloudflare v4 下载
      # =========================================================
      - name: Download WeChat via Cloudflare v4
        shell: powershell
        run: |
          $installer = "$env:TEMP\$env:WECHAT_FILENAME"

          Write-Host "Downloading:"
          Write-Host $env:WECHAT_PROXY_URL

          $start = Get-Date

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 2 `
            --connect-timeout 30 `
            --progress-bar `
            -o $installer `
            $env:WECHAT_PROXY_URL

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed."
          }

          $seconds = ((Get-Date) - $start).TotalSeconds
          $sizeMB = (Get-Item $installer).Length / 1MB

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Download completed"
          Write-Host ("Size:  {0:N2} MB" -f $sizeMB)
          Write-Host ("Time:  {0:N2} seconds" -f $seconds)
          Write-Host ("Speed: {0:N2} MB/s" -f ($sizeMB / $seconds))
          Write-Host "======================================"

          "WECHAT_INSTALLER=$installer" >> $env:GITHUB_ENV


      # =========================================================
      # 4. SHA256 校验
      # =========================================================
      - name: Verify SHA256
        shell: powershell
        run: |
          $expected = "c3032fedf2e4025bf7ef87504fd98e46d0fd6db4e5e82ea3d1d0b70e85143cd0"

          $actual = (
            Get-FileHash `
              $env:WECHAT_INSTALLER `
              -Algorithm SHA256
          ).Hash.ToLower()

          Write-Host "Expected:"
          Write-Host $expected

          Write-Host ""
          Write-Host "Actual:"
          Write-Host $actual

          if ($actual -ne $expected) {
            Remove-Item $env:WECHAT_INSTALLER -Force
            throw "SHA256 mismatch! Installation aborted."
          }

          Write-Host ""
          Write-Host "SHA256 verification passed."


      # =========================================================
      # 5. 安装微信
      # =========================================================
      - name: Install WeChat
        shell: powershell
        run: |
          Write-Host "Installing WeChat..."

          Start-Process `
            -FilePath $env:WECHAT_INSTALLER `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Installation completed."


      # =========================================================
      # 6. 找微信路径
      # 不再 Get-ChildItem -Recurse，避免之前 1m50s 的扫描
      # =========================================================
      - name: Locate WeChat
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\Tencent\Weixin\Weixin.exe",
            "C:\Program Files (x86)\Tencent\Weixin\Weixin.exe",
            "C:\Program Files\Tencent\WeChat\WeChat.exe",
            "C:\Program Files (x86)\Tencent\WeChat\WeChat.exe"
          )

          $wechat = $candidates |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (-not $wechat) {
            throw "WeChat executable not found."
          }

          Write-Host "Found:"
          Write-Host $wechat

          Write-Host ""
          Write-Host "File version:"
          Write-Host (Get-Item $wechat).VersionInfo.FileVersion

          "WECHAT_EXE=$wechat" >> $env:GITHUB_ENV


      # =========================================================
      # 7. 启动微信，并动态等待窗口
      # =========================================================
      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching:"
          Write-Host $env:WECHAT_EXE

          Start-Process $env:WECHAT_EXE

          $found = $false

          for ($i = 0; $i -lt 30; $i++) {

            $process = Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              } |
              Where-Object {
                $_.MainWindowHandle -ne 0
              } |
              Select-Object -First 1

            if ($process) {
              Write-Host "WeChat window detected after $i seconds."
              Write-Host "PID: $($process.Id)"
              Write-Host "Title: $($process.MainWindowTitle)"

              $found = $true
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $found) {
            throw "WeChat GUI was not detected."
          }

          Start-Sleep -Seconds 2


      # =========================================================
      # 8. 截二维码
      # =========================================================
      - name: Capture login QR
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-login.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Login screenshot saved."


      # =========================================================
      # 9. 上传二维码
      # =========================================================
      - name: Upload login QR
        id: upload-qr
        uses: actions/upload-artifact@v4
        with:
          name: wechat-login
          path: wechat-login.png
          retention-days: 1


      # =========================================================
      # 10. 输出二维码 Artifact 地址
      # =========================================================
      - name: Print QR URL
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "DOWNLOAD QR AND SCAN NOW:"
          Write-Host "${{ steps.upload-qr.outputs.artifact-url }}"
          Write-Host "======================================"
          Write-Host ""


      # =========================================================
      # 11. 等待登录
      # 最多 10 分钟
      # 登录成功立即继续
      # =========================================================
      - name: Wait for WeChat login
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(
                  IntPtr hWnd,
                  out RECT lpRect
              );

              public struct RECT {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }
          }
          "@

          Write-Host "Waiting for login..."
          Write-Host "Maximum: 2 minutes."

          $deadline = (Get-Date).AddMinutes(2)
          $loggedIn = $false

          while ((Get-Date) -lt $deadline) {

            $processes = Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              }

            foreach ($p in $processes) {

              $p.Refresh()

              if ($p.MainWindowHandle -eq 0) {
                continue
              }

              $rect = New-Object Win32+RECT

              if (
                [Win32]::GetWindowRect(
                  $p.MainWindowHandle,
                  [ref]$rect
                )
              ) {

                $width = $rect.Right - $rect.Left
                $height = $rect.Bottom - $rect.Top

                Write-Host (
                  "[{0}] PID={1} Process={2} Size={3}x{4}" -f `
                  (Get-Date -Format "HH:mm:ss"),
                  $p.Id,
                  $p.ProcessName,
                  $width,
                  $height
                )

                # 扫码窗口通常小
                # 主微信窗口明显更大
                if ($width -ge 500 -and $height -ge 400) {

                  Write-Host ""
                  Write-Host "======================================"
                  Write-Host "LOGIN SUCCESS DETECTED"
                  Write-Host "======================================"

                  $loggedIn = $true
                  break
                }
              }
            }

            if ($loggedIn) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $loggedIn) {
            throw "Login timeout."
          }

          Start-Sleep -Seconds 3


      # =========================================================
      # 12. 登录成功后截图
      # =========================================================
      - name: Capture logged-in screen
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-logged-in.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()


      # =========================================================
      # 13. 上传登录成功后的截图
      # =========================================================
      - name: Upload logged-in screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-logged-in
          path: wechat-logged-in.png
          retention-days: 1

      # =========================================================
      # 14. 安装 wxauto4
      # =========================================================
      - name: Install wxauto4
        shell: powershell
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install wxauto4

          Write-Host "=== installed package ==="
          python -m pip show wxauto4

      # =========================================================
      # 15. 测试 wxauto4 连接
      # =========================================================
      - name: Test wxauto4 connection
        shell: powershell
        run: |
          @'
          from wxauto4 import WeChat
          import traceback

          print("Initializing wxauto4...", flush=True)

          try:
              wx = WeChat()

              print("SUCCESS: WeChat() initialized", flush=True)

              msgs = wx.GetAllMessage()

              print(f"Messages found: {len(msgs)}", flush=True)

              for msg in msgs[-10:]:
                  sender = getattr(msg, "sender", "")
                  content = getattr(msg, "content", "")
                  msg_type = getattr(msg, "type", "")

                  print(
                      f"type={msg_type} sender={sender} content={content}",
                      flush=True
                  )

          except Exception as e:
              print("WXAUTO4 TEST FAILED", flush=True)
              print(repr(e), flush=True)
              traceback.print_exc()
              raise
          '@ | Set-Content `
              "$env:GITHUB_WORKSPACE\test_wxauto4.py" `
              -Encoding UTF8

          python "$env:GITHUB_WORKSPACE\test_wxauto4.py"
