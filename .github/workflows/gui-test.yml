name: WeChat GUI Test

on:
  workflow_dispatch:

jobs:
  wechat-test:
    runs-on: windows-2022

    steps:
      - name: Show session info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser

      - name: Download WeChat
        shell: powershell
        run: |
          $url = "https://dldir1v6.qq.com/weixin/Universal/Windows/WeChatWin_4.1.11.exe"
          $installer = "$env:TEMP\WeChatSetup.exe"

          Write-Host "Downloading WeChat..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Downloaded:"
          Get-Item $installer | Select-Object FullName, Length

          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"

          $expected = "C3032FEDF2E4025BF7EF87504FD98E46D0FD6DB4E5E82EA3D1D0B70E85143CD0"

          if ($hash -ne $expected) {
            throw "SHA256 mismatch!"
          }

          Write-Host "SHA256 verification passed."

      - name: Install WeChat
        shell: powershell
        run: |
          $installer = "$env:TEMP\WeChatSetup.exe"

          Write-Host "Installing WeChat..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Installer finished."

          Start-Sleep -Seconds 5

      - name: Find WeChat executable
        shell: powershell
        run: |
          Write-Host "Searching for WeChat / Weixin executable..."

          $roots = @(
            "$env:ProgramFiles",
            "${env:ProgramFiles(x86)}",
            "$env:LOCALAPPDATA"
          )

          $wechat = Get-ChildItem `
            -Path $roots `
            -Include "WeChat.exe","Weixin.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $wechat) {
            Write-Host "Executable not found."

            Write-Host "=== Tencent directories ==="

            Get-ChildItem `
              "$env:ProgramFiles",
              "${env:ProgramFiles(x86)}" `
              -Directory `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "Tencent|WeChat|Weixin"
              } |
              Select-Object FullName

            exit 1
          }

          Write-Host "Found executable:"
          Write-Host $wechat.FullName

          "WECHAT_EXE=$($wechat.FullName)" >> $env:GITHUB_ENV

      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching:"
          Write-Host $env:WECHAT_EXE

          Start-Process $env:WECHAT_EXE

          Write-Host "Waiting 20 seconds..."
          Start-Sleep -Seconds 20

          Write-Host "=== Related processes ==="

          Get-Process |
            Where-Object {
              $_.ProcessName -match "WeChat|Weixin"
            } |
            Select-Object `
              ProcessName,
              Id,
              SessionId,
              MainWindowTitle

      - name: Take screenshot
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          Write-Host "Screen:"
          Write-Host "$($bounds.Width)x$($bounds.Height)"

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-desktop.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Screenshot saved:"
          Write-Host $path

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-desktop
          path: wechat-desktop.png
