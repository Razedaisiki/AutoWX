name: WeChat 4.1 Login Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WECHAT_REPO: "cscnk52/wechat-windows-versions"
  WECHAT_VERSION: "4.1.8"
  GH_PROXY: "https://v4.gh-proxy.org/"

jobs:
  wechat-test:
    runs-on: windows-2022

    steps:
      # =========================================================
      # 1. 检查 Windows GUI Session
      # =========================================================
      - name: Show session info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser


      # =========================================================
      # 2. 自动寻找最新的 4.1.8.x Release
      # =========================================================
      - name: Resolve latest WeChat 4.1.8 release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = $env:WECHAT_REPO

          $headers = @{
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent"    = "AutoWX"
          }

          $all = @()

          for ($page = 1; $page -le 5; $page++) {

            $api = "https://api.github.com/repos/$repo/releases?per_page=100&page=$page"

            $batch = Invoke-RestMethod `
              -Uri $api `
              -Headers $headers

            if (-not $batch -or $batch.Count -eq 0) {
              break
            }

            $all += $batch
          }

          $release = $all |
            Where-Object {
              $_.tag_name -match '^v4\.1\.8\.'
            } |
            Sort-Object {
              [version]($_.tag_name.TrimStart('v'))
            } -Descending |
            Select-Object -First 1

          if (-not $release) {
            throw "No WeChat 4.1.8.x release found."
          }

          Write-Host "Selected:"
          Write-Host $release.tag_name
          Write-Host $release.name

          $asset = $release.assets |
            Where-Object {
              $_.name -match '\.exe$'
            } |
            Sort-Object size -Descending |
            Select-Object -First 1

          if (-not $asset) {
            throw "No EXE asset found."
          }

          $original = $asset.browser_download_url
          $proxy = "$env:GH_PROXY$original"

          Write-Host ""
          Write-Host "Asset:"
          Write-Host $asset.name

          Write-Host ""
          Write-Host "Proxy URL:"
          Write-Host $proxy

          "WECHAT_TAG=$($release.tag_name)" >> $env:GITHUB_ENV
          "WECHAT_FILENAME=$($asset.name)" >> $env:GITHUB_ENV
          "WECHAT_PROXY_URL=$proxy" >> $env:GITHUB_ENV

          # 如果 GitHub Asset 自带 digest，保存下来供校验
          if ($asset.digest) {
            Write-Host ""
            Write-Host "GitHub asset digest:"
            Write-Host $asset.digest
            "WECHAT_DIGEST=$($asset.digest)" >> $env:GITHUB_ENV
          }


      # =========================================================
      # 3. 通过 Cloudflare v4 下载
      # =========================================================
      - name: Download WeChat via Cloudflare v4
        shell: powershell
        run: |
          $installer = "$env:TEMP\$env:WECHAT_FILENAME"

          Write-Host "Downloading:"
          Write-Host $env:WECHAT_PROXY_URL

          $start = Get-Date

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 2 `
            --connect-timeout 30 `
            --progress-bar `
            -o $installer `
            $env:WECHAT_PROXY_URL

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed."
          }

          $seconds = ((Get-Date) - $start).TotalSeconds
          $sizeMB = (Get-Item $installer).Length / 1MB

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Download completed"
          Write-Host ("Size:  {0:N2} MB" -f $sizeMB)
          Write-Host ("Time:  {0:N2} seconds" -f $seconds)
          Write-Host ("Speed: {0:N2} MB/s" -f ($sizeMB / $seconds))
          Write-Host "======================================"

          "WECHAT_INSTALLER=$installer" >> $env:GITHUB_ENV


      # =========================================================
      # 4. SHA256 校验（有 digest 则校验，否则仅打印）
      # =========================================================
      - name: Verify SHA256
        shell: powershell
        run: |
          $actual = (
            Get-FileHash `
              $env:WECHAT_INSTALLER `
              -Algorithm SHA256
          ).Hash.ToLower()

          Write-Host "Actual SHA256:"
          Write-Host $actual

          if ($env:WECHAT_DIGEST) {

            $expected = $env:WECHAT_DIGEST `
              -replace "^sha256:", ""

            $expected = $expected.ToLower()

            Write-Host ""
            Write-Host "Expected (from GitHub digest):"
            Write-Host $expected

            if ($actual -ne $expected) {
              Remove-Item $env:WECHAT_INSTALLER -Force
              throw "SHA256 mismatch! Installation aborted."
            }

            Write-Host ""
            Write-Host "SHA256 verification passed."

          } else {

            Write-Host ""
            Write-Host "No digest available from release asset."
            Write-Host "Record the SHA256 above to pin it later."
          }


      # =========================================================
      # 5. 安装微信
      # =========================================================
      - name: Install WeChat
        shell: powershell
        run: |
          Write-Host "Installing WeChat..."

          Start-Process `
            -FilePath $env:WECHAT_INSTALLER `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Installation completed."


      # =========================================================
      # 6. 找微信路径
      # 不再 Get-ChildItem -Recurse，避免之前 1m50s 的扫描
      # =========================================================
      - name: Locate WeChat
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\Tencent\Weixin\Weixin.exe",
            "C:\Program Files (x86)\Tencent\Weixin\Weixin.exe",
            "C:\Program Files\Tencent\WeChat\WeChat.exe",
            "C:\Program Files (x86)\Tencent\WeChat\WeChat.exe"
          )

          $wechat = $candidates |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (-not $wechat) {
            throw "WeChat executable not found."
          }

          Write-Host "Found:"
          Write-Host $wechat

          Write-Host ""
          Write-Host "File version:"
          Write-Host (Get-Item $wechat).VersionInfo.FileVersion

          "WECHAT_EXE=$wechat" >> $env:GITHUB_ENV


      # =========================================================
      # 7. 启动微信，并动态等待窗口
      # =========================================================
      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching:"
          Write-Host $env:WECHAT_EXE

          Start-Process $env:WECHAT_EXE

          $found = $false

          for ($i = 0; $i -lt 30; $i++) {

            $process = Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              } |
              Where-Object {
                $_.MainWindowHandle -ne 0
              } |
              Select-Object -First 1

            if ($process) {
              Write-Host "WeChat window detected after $i seconds."
              Write-Host "PID: $($process.Id)"
              Write-Host "Title: $($process.MainWindowTitle)"

              $found = $true
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $found) {
            throw "WeChat GUI was not detected."
          }

          Start-Sleep -Seconds 2


      # =========================================================
      # 8. 截二维码
      # =========================================================
      - name: Capture login QR
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-login.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Login screenshot saved."


      # =========================================================
      # 9. 上传二维码
      # =========================================================
      - name: Upload login QR
        id: upload-qr
        uses: actions/upload-artifact@v4
        with:
          name: wechat-login
          path: wechat-login.png
          retention-days: 1


      # =========================================================
      # 10. 输出二维码 Artifact 地址
      # =========================================================
      - name: Print QR URL
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "DOWNLOAD QR AND SCAN NOW:"
          Write-Host "${{ steps.upload-qr.outputs.artifact-url }}"
          Write-Host "======================================"
          Write-Host ""


      # =========================================================
      # 11. 等待登录
      # 最多 10 分钟
      # 登录成功立即继续
      # =========================================================
      - name: Wait for WeChat login
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(
                  IntPtr hWnd,
                  out RECT lpRect
              );

              public struct RECT {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }
          }
          "@

          Write-Host "Waiting for login..."
          Write-Host "Maximum: 2 minutes."

          $deadline = (Get-Date).AddMinutes(2)
          $loggedIn = $false

          while ((Get-Date) -lt $deadline) {

            $processes = Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              }

            foreach ($p in $processes) {

              $p.Refresh()

              if ($p.MainWindowHandle -eq 0) {
                continue
              }

              $rect = New-Object Win32+RECT

              if (
                [Win32]::GetWindowRect(
                  $p.MainWindowHandle,
                  [ref]$rect
                )
              ) {

                $width = $rect.Right - $rect.Left
                $height = $rect.Bottom - $rect.Top

                Write-Host (
                  "[{0}] PID={1} Process={2} Size={3}x{4}" -f `
                  (Get-Date -Format "HH:mm:ss"),
                  $p.Id,
                  $p.ProcessName,
                  $width,
                  $height
                )

                # 扫码窗口通常小
                # 主微信窗口明显更大
                if ($width -ge 500 -and $height -ge 400) {

                  Write-Host ""
                  Write-Host "======================================"
                  Write-Host "LOGIN SUCCESS DETECTED"
                  Write-Host "======================================"

                  $loggedIn = $true
                  break
                }
              }
            }

            if ($loggedIn) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $loggedIn) {
            throw "Login timeout."
          }

          Start-Sleep -Seconds 3


      # =========================================================
      # 12. 登录成功后截图
      # =========================================================
      - name: Capture logged-in screen
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-logged-in.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()


      # =========================================================
      # 13. 上传登录成功后的截图
      # =========================================================
      - name: Upload logged-in screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-logged-in
          path: wechat-logged-in.png
          retention-days: 1

      # =========================================================
      # 14. 关闭微信更新说明弹窗
      # =========================================================
      - name: Normalize WeChat window
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@

          Write-Host "=== BEFORE ==="

          Get-Process |
            Where-Object {
              $_.ProcessName -match "Weixin|WeChat"
            } |
            ForEach-Object {
              $_.Refresh()

              Write-Host (
                "PID={0} Process={1} Title='{2}' Handle={3}" -f `
                $_.Id,
                $_.ProcessName,
                $_.MainWindowTitle,
                $_.MainWindowHandle
              )
            }

          $p = Get-Process |
            Where-Object {
              $_.ProcessName -match "Weixin|WeChat" -and
              $_.MainWindowHandle -ne 0
            } |
            Select-Object -First 1

          if ($p) {
              [Win32]::SetForegroundWindow(
                  $p.MainWindowHandle
              ) | Out-Null

              Start-Sleep -Seconds 1

              [System.Windows.Forms.SendKeys]::SendWait("{ESC}")

              Start-Sleep -Seconds 2
          }

      # =========================================================
      # 15. 安装 wxauto4
      # =========================================================
      - name: Install wxauto4
        shell: powershell
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install wxauto4

          Write-Host "=== installed package ==="
          python -m pip show wxauto4

      # =========================================================
      # 16. 窗口体检：诊断 Win32 / UIA 视图
      # =========================================================
      - name: Diagnose WeChat window
        shell: powershell
        run: |
          python -m pip install pywinauto psutil

          @'
          import ctypes
          import psutil
          from pywinauto import Desktop

          print("=" * 70)
          print("WECHAT PROCESS INFO")
          print("=" * 70)

          wechat_pids = []

          for p in psutil.process_iter(
              ["pid", "name", "exe", "username"]
          ):
              try:
                  name = (p.info["name"] or "").lower()

                  if "wechat" in name or "weixin" in name:
                      pid = p.info["pid"]
                      wechat_pids.append(pid)

                      session = ctypes.c_ulong()

                      ok = ctypes.windll.kernel32.ProcessIdToSessionId(
                          pid,
                          ctypes.byref(session)
                      )

                      print(
                          f"PID={pid} "
                          f"Name={p.info['name']} "
                          f"Session={session.value if ok else '?'} "
                          f"User={p.info['username']} "
                          f"EXE={p.info['exe']}"
                      )

              except Exception as e:
                  print("PROCESS ERROR:", repr(e))

          print()
          print("WeChat PIDs:", wechat_pids)

          print()
          print("=" * 70)
          print("WIN32 WINDOWS")
          print("=" * 70)

          try:
              windows = Desktop(
                  backend="win32"
              ).windows()

              for w in windows:

                  try:
                      pid = w.process_id()

                      if pid not in wechat_pids:
                          continue

                      print(
                          f"PID={pid} "
                          f"Handle={hex(w.handle)} "
                          f"Title={w.window_text()!r} "
                          f"Class={w.class_name()!r} "
                          f"Visible={w.is_visible()} "
                          f"Rect={w.rectangle()}"
                      )

                  except Exception as e:
                      print("WIN32 WINDOW ERROR:", repr(e))

          except Exception as e:
              print("WIN32 BACKEND ERROR:", repr(e))

          print()
          print("=" * 70)
          print("UI AUTOMATION WINDOWS")
          print("=" * 70)

          try:
              windows = Desktop(
                  backend="uia"
              ).windows()

              found = 0

              for w in windows:

                  try:
                      pid = w.process_id()

                      if pid not in wechat_pids:
                          continue

                      found += 1

                      info = w.element_info

                      print(
                          f"PID={pid} "
                          f"Handle={hex(w.handle)} "
                          f"Title={w.window_text()!r} "
                          f"Class={info.class_name!r} "
                          f"ControlType={info.control_type!r} "
                          f"Visible={w.is_visible()} "
                          f"Rect={w.rectangle()}"
                      )

                      print("--- UIA children ---")

                      children = w.descendants(depth=2)

                      for child in children[:30]:

                          try:
                              ci = child.element_info

                              print(
                                  f"  Name={ci.name!r} "
                                  f"Class={ci.class_name!r} "
                                  f"Type={ci.control_type!r} "
                                  f"AutoID={ci.automation_id!r}"
                              )

                          except Exception:
                              pass

                  except Exception as e:
                      print("UIA WINDOW ERROR:", repr(e))

              print()
              print("UIA WeChat windows found:", found)

          except Exception as e:
              print("UIA BACKEND ERROR:", repr(e))

          print()
          print("=" * 70)
          print("END")
          print("=" * 70)

          '@ | Set-Content `
              "$env:GITHUB_WORKSPACE\diagnose_wechat.py" `
              -Encoding UTF8

          python "$env:GITHUB_WORKSPACE\diagnose_wechat.py"

      # =========================================================
      # 17. 测试 wxauto4 连接
      # =========================================================
      - name: Test wxauto4 connection
        shell: powershell
        run: |
          @'
          from wxauto4 import WeChat
          import traceback
          import time

          print("Waiting for WeChat UI...", flush=True)
          time.sleep(3)

          try:
              print("Initializing wxauto4...", flush=True)

              wx = WeChat(ads=False)

              print("SUCCESS: wxauto4 connected", flush=True)

              msgs = wx.GetAllMessage()

              print("Messages:", len(msgs), flush=True)

              for msg in msgs[-10:]:
                  print(
                      getattr(msg, "sender", ""),
                      getattr(msg, "content", ""),
                      flush=True
                  )

          except Exception:
              traceback.print_exc()
              raise
          '@ | Set-Content `
              "$env:GITHUB_WORKSPACE\test_wxauto4.py" `
              -Encoding UTF8

          python "$env:GITHUB_WORKSPACE\test_wxauto4.py"
