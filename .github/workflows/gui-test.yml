name: WeChat 4.1 Login Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_VERSION: "4.1.11"
  WECHAT_REPO: "tom-snow/wechat-windows-versions"
  GH_PROXY: "https://v4.gh-proxy.org/"

jobs:
  wechat-test:
    runs-on: windows-2022

    steps:
      - name: Show session
        shell: powershell
        run: |
          whoami
          quser

      # 1. 从历史版本仓库中找到 4.1.11
      - name: Resolve WeChat release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $api = "https://api.github.com/repos/$env:WECHAT_REPO/releases?per_page=100"

          $headers = @{
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent"    = "AutoWX"
          }

          Write-Host "Searching release:"
          Write-Host $env:TARGET_VERSION

          $releases = Invoke-RestMethod `
            -Uri $api `
            -Headers $headers

          $release = $releases |
            Where-Object {
              $_.tag_name -match [regex]::Escape($env:TARGET_VERSION) -or
              $_.name     -match [regex]::Escape($env:TARGET_VERSION)
            } |
            Select-Object -First 1

          if (-not $release) {
            Write-Host "Available recent releases:"
            $releases |
              Select-Object -First 20 tag_name,name |
              Format-Table

            throw "Could not find WeChat $env:TARGET_VERSION"
          }

          Write-Host ""
          Write-Host "Selected release:"
          Write-Host "Tag:  $($release.tag_name)"
          Write-Host "Name: $($release.name)"

          Write-Host ""
          Write-Host "Assets:"

          $release.assets |
            Select-Object name,size,browser_download_url |
            Format-Table

          # 优先选择体积最大的 Windows exe
          $asset = $release.assets |
            Where-Object {
              $_.name -match "\.exe$"
            } |
            Sort-Object size -Descending |
            Select-Object -First 1

          if (-not $asset) {
            throw "No EXE asset found."
          }

          $original = $asset.browser_download_url
          $proxy = "$env:GH_PROXY$original"

          Write-Host ""
          Write-Host "Selected asset:"
          Write-Host $asset.name

          Write-Host ""
          Write-Host "Original:"
          Write-Host $original

          Write-Host ""
          Write-Host "Accelerated:"
          Write-Host $proxy

          "WECHAT_URL=$proxy" >> $env:GITHUB_ENV
          "WECHAT_FILENAME=$($asset.name)" >> $env:GITHUB_ENV

          # 如果 GitHub Release Asset 自带 digest，也保存下来
          if ($asset.digest) {
            Write-Host "GitHub asset digest:"
            Write-Host $asset.digest
            "WECHAT_DIGEST=$($asset.digest)" >> $env:GITHUB_ENV
          }

      # 2. 通过 Cloudflare v4 节点下载
      - name: Download WeChat via Cloudflare v4
        shell: powershell
        run: |
          $installer = "$env:TEMP\$env:WECHAT_FILENAME"

          Write-Host "Downloading:"
          Write-Host $env:WECHAT_URL

          $start = Get-Date

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 2 `
            --connect-timeout 30 `
            --progress-bar `
            -o $installer `
            $env:WECHAT_URL

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed."
          }

          $seconds = ((Get-Date) - $start).TotalSeconds
          $sizeMB = (Get-Item $installer).Length / 1MB

          Write-Host ""
          Write-Host "==============================="
          Write-Host ("Size:  {0:N2} MB" -f $sizeMB)
          Write-Host ("Time:  {0:N2} s" -f $seconds)
          Write-Host ("Speed: {0:N2} MB/s" -f ($sizeMB / $seconds))
          Write-Host "==============================="

          $sha = (
            Get-FileHash $installer -Algorithm SHA256
          ).Hash.ToLower()

          Write-Host "Downloaded SHA256:"
          Write-Host $sha

          "WECHAT_INSTALLER=$installer" >> $env:GITHUB_ENV
          "WECHAT_SHA256=$sha" >> $env:GITHUB_ENV

      # 3. 如果 GitHub Asset 提供 digest，就自动校验
      - name: Verify download
        shell: powershell
        run: |
          if ($env:WECHAT_DIGEST) {

            $expected = $env:WECHAT_DIGEST `
              -replace "^sha256:", ""

            $expected = $expected.ToLower()

            Write-Host "Expected:"
            Write-Host $expected

            Write-Host "Actual:"
            Write-Host $env:WECHAT_SHA256

            if ($expected -ne $env:WECHAT_SHA256) {
              Remove-Item $env:WECHAT_INSTALLER -Force
              throw "SHA256 mismatch."
            }

            Write-Host "SHA256 verification passed."

          } else {

            Write-Host "Release asset does not expose a digest."
            Write-Host "Calculated SHA256:"
            Write-Host $env:WECHAT_SHA256
          }

      # 4. 安装
      - name: Install WeChat
        shell: powershell
        run: |
          Write-Host "Installing WeChat..."

          Start-Process `
            -FilePath $env:WECHAT_INSTALLER `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Installation completed."

      # 5. 直接检查新版微信固定路径，不再递归扫描
      - name: Locate WeChat
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\Tencent\Weixin\Weixin.exe",
            "C:\Program Files (x86)\Tencent\Weixin\Weixin.exe",
            "C:\Program Files\Tencent\WeChat\WeChat.exe",
            "C:\Program Files (x86)\Tencent\WeChat\WeChat.exe"
          )

          $wechat = $candidates |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (-not $wechat) {
            throw "WeChat executable not found."
          }

          Write-Host "Found:"
          Write-Host $wechat

          Write-Host "Version:"
          Write-Host (Get-Item $wechat).VersionInfo.FileVersion

          "WECHAT_EXE=$wechat" >> $env:GITHUB_ENV

      # 6. 启动并动态等待 GUI 出现
      - name: Launch WeChat
        shell: powershell
        run: |
          Start-Process $env:WECHAT_EXE

          for ($i = 0; $i -lt 30; $i++) {

            $p = Get-Process |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              } |
              Where-Object {
                $_.MainWindowHandle -ne 0
              } |
              Select-Object -First 1

            if ($p) {
              Write-Host "WeChat GUI detected after $i seconds."
              Write-Host "PID: $($p.Id)"
              Write-Host "Title: $($p.MainWindowTitle)"
              break
            }

            Start-Sleep -Seconds 1
          }

      # 7. 截取二维码
      - name: Capture login QR
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-login.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

      - name: Upload login QR
        id: upload-qr
        uses: actions/upload-artifact@v4
        with:
          name: wechat-login
          path: wechat-login.png
          retention-days: 1

      - name: Print QR link
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================="
          Write-Host "SCAN LOGIN QR:"
          Write-Host "${{ steps.upload-qr.outputs.artifact-url }}"
          Write-Host "=============================="

      # 8. 最多等 10 分钟，但登录成功马上继续
      - name: Wait for login
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(
                  IntPtr hWnd,
                  out RECT lpRect
              );

              public struct RECT {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }
          }
          "@

          $deadline = (Get-Date).AddMinutes(10)

          while ((Get-Date) -lt $deadline) {

            $processes = Get-Process |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              }

            foreach ($p in $processes) {

              if ($p.MainWindowHandle -eq 0) {
                continue
              }

              $rect = New-Object Win32+RECT

              if (
                [Win32]::GetWindowRect(
                  $p.MainWindowHandle,
                  [ref]$rect
                )
              ) {

                $width  = $rect.Right - $rect.Left
                $height = $rect.Bottom - $rect.Top

                Write-Host (
                  "[{0}] {1} {2}x{3}" -f `
                  (Get-Date -Format "HH:mm:ss"),
                  $p.ProcessName,
                  $width,
                  $height
                )

                # 主界面通常明显比扫码窗口大
                if ($width -ge 600 -and $height -ge 450) {

                  Write-Host ""
                  Write-Host "LOGIN SUCCESS DETECTED"

                  Start-Sleep -Seconds 3
                  exit 0
                }
              }
            }

            Start-Sleep -Seconds 3
          }

          throw "Login timeout."
