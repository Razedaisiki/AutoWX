name: WeChat 3.9.11.16 Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wechat-old-test:
    runs-on: windows-2022

    steps:
      - name: Show session info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser

          Write-Host "=== OS ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      # ---------------------------------------------------------
      # 1. 通过 Cloudflare v4 代理下载固定版本
      # ---------------------------------------------------------
      - name: Download WeChat 3.9.11.16 via Cloudflare v4
        shell: powershell
        run: |
          $url = "https://v4.gh-proxy.org/https://github.com/tom-snow/wechat-windows-versions-x86/releases/download/v3.9.11.16/WeChatSetupX86-3.9.11.16.exe"

          $installer = "$env:TEMP\WeChatSetupX86-3.9.11.16.exe"

          Write-Host "Downloading WeChat 3.9.11.16..."
          Write-Host $url

          $start = Get-Date

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --progress-bar `
            -o $installer `
            $url

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed."
          }

          $seconds = ((Get-Date) - $start).TotalSeconds
          $sizeMB = (Get-Item $installer).Length / 1MB

          Write-Host ""
          Write-Host "Download completed."
          Write-Host ("Size:  {0:N2} MB" -f $sizeMB)
          Write-Host ("Time:  {0:N2} seconds" -f $seconds)
          Write-Host ("Speed: {0:N2} MB/s" -f ($sizeMB / $seconds))

          "WECHAT_INSTALLER=$installer" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 2. 验证 SHA256
      # ---------------------------------------------------------
      - name: Verify SHA256
        shell: powershell
        run: |
          $expected = "e649b4a616a1e45094858d111cb1306c08cb73b7743718050c93b2b92575ce84"

          $actual = (
            Get-FileHash `
              $env:WECHAT_INSTALLER `
              -Algorithm SHA256
          ).Hash.ToLower()

          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"

          if ($actual -ne $expected) {
            Remove-Item $env:WECHAT_INSTALLER -Force
            throw "SHA256 mismatch!"
          }

          Write-Host "SHA256 verification passed."

      # ---------------------------------------------------------
      # 3. 静默安装
      # ---------------------------------------------------------
      - name: Install old WeChat
        shell: powershell
        run: |
          Write-Host "Installing WeChat 3.9.11.16 x86..."

          Start-Process `
            -FilePath $env:WECHAT_INSTALLER `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Installer exited."

          Start-Sleep -Seconds 5

      # ---------------------------------------------------------
      # 4. 固定路径检查
      # ---------------------------------------------------------
      - name: Find WeChat executable
        shell: powershell
        run: |
          $wechat = "${env:ProgramFiles(x86)}\Tencent\WeChat\WeChat.exe"

          if (-not (Test-Path $wechat)) {
            throw "WeChat.exe not found at expected path: $wechat"
          }

          Write-Host "Found:"
          Write-Host $wechat

          Write-Host ""
          Write-Host "File version:"
          Write-Host (Get-Item $wechat).VersionInfo.FileVersion

          "WECHAT_EXE=$wechat" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 5. 启动微信（动态等待窗口出现）
      # ---------------------------------------------------------
      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching WeChat..."

          Start-Process $env:WECHAT_EXE

          $timeout = 20
          $found = $false

          for ($i = 0; $i -lt $timeout; $i++) {

            $process = Get-Process WeChat -ErrorAction SilentlyContinue |
              Where-Object {
                $_.MainWindowHandle -ne 0
              } |
              Select-Object -First 1

            if ($process) {
              Write-Host "WeChat window detected after $i seconds."
              Write-Host "PID: $($process.Id)"
              Write-Host "Title: $($process.MainWindowTitle)"
              $found = $true
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $found) {
            Write-Host "Warning: WeChat window was not detected within 20 seconds."
          }

      # ---------------------------------------------------------
      # 6. 截图
      # ---------------------------------------------------------
      - name: Take screenshot
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          Write-Host "Screen:"
          Write-Host "$($bounds.Width)x$($bounds.Height)"

          $bitmap = New-Object System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $path = "$env:GITHUB_WORKSPACE\wechat-3.9.11.16.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Screenshot saved:"
          Write-Host $path

      # ---------------------------------------------------------
      # 7. 上传截图
      # ---------------------------------------------------------
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-3.9.11.16-screenshot
          path: wechat-3.9.11.16.png
