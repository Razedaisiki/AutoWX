name: VXBot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vxbot
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUNBUFFERED: "1"

  WECHAT_REPO: "cscnk52/wechat-windows-versions"
  GH_PROXY: "https://v4.gh-proxy.org/"

  MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
  MODEL_API_BASE: ${{ vars.MODEL_API_BASE }}
  MODEL_NAME: ${{ vars.MODEL_NAME }}
  VX_GROUPS_JSON: ${{ vars.VX_GROUPS_JSON }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  BOT_CONTEXT_SIZE: "10"

jobs:
  vxbot:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show session info
        shell: powershell
        run: |
          Write-Host "=== USER ==="
          whoami

          Write-Host "=== SESSION ==="
          quser

      # ---------------------------------------------------------
      # 下载安装微信（解析 → 下载 → 校验 → 安装 → 定位）
      # ---------------------------------------------------------
      - name: Install WeChat
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          ./scripts/windows/install-wechat.ps1

      # ---------------------------------------------------------
      # 启动前预配置无障碍（避免 wx4py 重启微信掉登录）
      # ---------------------------------------------------------
      - name: Configure WeChat accessibility
        shell: powershell
        run: |
          Write-Host "=== Configure WeChat accessibility (pre-launch) ==="

          reg add `
            "HKCU\SOFTWARE\Microsoft\Narrator\NoRoam" `
            /v RunningState `
            /t REG_DWORD `
            /d 1 `
            /f

          Write-Host "RunningState set to 1"

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class SysParam {
              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool SystemParametersInfoW(
                  uint uiAction,
                  uint uiParam,
                  IntPtr pvParam,
                  uint fWinIni
              );
          }
          "@

          $SPI_SETSCREENREADER = 0x0047
          $SPIF_UPDATEINIFILE  = 0x01
          $SPIF_SENDCHANGE     = 0x02

          $ok = [SysParam]::SystemParametersInfoW(
            $SPI_SETSCREENREADER,
            1,
            [IntPtr]::Zero,
            ($SPIF_UPDATEINIFILE -bor $SPIF_SENDCHANGE)
          )

          Write-Host "Screen reader flag set: $ok"

      # ---------------------------------------------------------
      # 启动微信
      # ---------------------------------------------------------
      - name: Launch WeChat
        shell: powershell
        run: |
          Write-Host "Launching:"
          Write-Host $env:WECHAT_EXE

          Start-Process $env:WECHAT_EXE

          $found = $false

          for ($i = 0; $i -lt 30; $i++) {
            $process = Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match "Weixin|WeChat"
              } |
              Where-Object {
                $_.MainWindowHandle -ne 0
              } |
              Select-Object -First 1

            if ($process) {
              Write-Host "WeChat window detected after $i seconds."
              $found = $true
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $found) {
            throw "WeChat GUI was not detected."
          }

          Start-Sleep -Seconds 2

      # ---------------------------------------------------------
      # 截二维码并发到 Telegram
      # ---------------------------------------------------------
      - name: Capture login QR
        shell: powershell
        run: |
          ./scripts/windows/capture-login-qr.ps1

      - name: Send login QR to Telegram
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          ./scripts/windows/send-telegram.ps1 `
            -Photo wechat-login.png `
            -Caption "AutoWX 微信登录二维码 - Run #${{ github.run_number }}"

      - name: Upload login QR
        id: upload-qr
        uses: actions/upload-artifact@v4
        with:
          name: wechat-login
          path: wechat-login.png
          retention-days: 1

      - name: Print QR URL
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "DOWNLOAD QR AND SCAN NOW:"
          Write-Host "${{ steps.upload-qr.outputs.artifact-url }}"

      # ---------------------------------------------------------
      # 等待扫码登录
      # ---------------------------------------------------------
      - name: Wait for WeChat login
        shell: powershell
        run: |
          ./scripts/windows/wait-wechat-login.ps1

      - name: Notify Telegram login success
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          ./scripts/windows/send-telegram.ps1 `
            -Text "✅ 微信登录成功，VXBot 正在启动。Run #${{ github.run_number }}"

      # ---------------------------------------------------------
      # 关闭弹窗 + 登录后截图
      # ---------------------------------------------------------
      - name: Normalize WeChat window
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@

          $p = Get-Process |
            Where-Object {
              $_.ProcessName -match "Weixin|WeChat" -and
              $_.MainWindowHandle -ne 0
            } |
            Select-Object -First 1

          if ($p) {
            [Win32]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
            Start-Sleep -Seconds 2
          }

      - name: Capture logged-in screen
        shell: powershell
        run: |
          ./scripts/windows/capture-login-qr.ps1 -OutputPath wechat-logged-in.png

      - name: Upload logged-in screenshot
        uses: actions/upload-artifact@v4
        with:
          name: wechat-logged-in
          path: wechat-logged-in.png
          retention-days: 1

      # ---------------------------------------------------------
      # Python 环境
      # ---------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          chcp 65001 > $null

          python -X utf8 -m pip install `
            --upgrade pip

          python -X utf8 -m pip install `
            -e .

          python -X utf8 -c `
            "import importlib.metadata as m; print('wx4py version:', m.version('wx4py'))"

      # ---------------------------------------------------------
      # 启动 VXBot
      # ---------------------------------------------------------
      - name: Start VXBot
        shell: powershell
        run: |
          chcp 65001 > $null

          [Console]::InputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          [Console]::OutputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          $OutputEncoding = `
            [System.Text.UTF8Encoding]::new($false)

          Write-Host "======================================"
          Write-Host "Starting VXBot"
          Write-Host "======================================"

          python -X utf8 -m autowx
